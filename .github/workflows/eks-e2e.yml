name: eks-e2e
# Experimental enterprise path: GitHub OIDC -> lab AWS role -> terraform apply
# -> Substrate from release images with S3 snapshots -> checks -> destroy.
on:
  workflow_dispatch:
    inputs:
      keep_cluster:
        description: "Skip destroy (you pay until you destroy)"
        type: boolean
        default: false
permissions:
  id-token: write
  contents: read
jobs:
  eks:
    runs-on: ubuntu-latest
    environment: eks
    timeout-minutes: 100
    env:
      TARGET: eks
      TF_VAR_budget_email: ${{ secrets.BUDGET_EMAIL }}
      REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: agent-substrate/substrate
          ref: v1.0.0
          path: .work/substrate
      - uses: actions/setup-go@v5
        with: { go-version-file: .work/substrate/go.mod, cache: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.REGION }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - name: terraform apply
        working-directory: infra/eks/terraform
        run: terraform init -input=false && terraform apply -auto-approve -input=false -var "name=sublab-${{ github.run_id }}" -var "region=$REGION"
      - name: kubeconfig
        run: aws eks update-kubeconfig --name "$(terraform -chdir=infra/eks/terraform output -raw cluster_name)" --region "$REGION"
      - name: Install Substrate + memory agent
        run: bash infra/eks/install.sh
      - name: Checks on EKS
        run: SUBLAB_RESUME_P95_MS=3000 bash e2e/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: substrate-checks-eks, path: evals/results/ }
      - name: terraform destroy
        if: always() && !inputs.keep_cluster
        working-directory: infra/eks/terraform
        run: terraform destroy -auto-approve -input=false -var "name=sublab-${{ github.run_id }}" -var "region=$REGION"
